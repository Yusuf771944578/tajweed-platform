name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ['tajweed-platform/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy static demos
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy tajweed-platform --project-name=tajweed-platform
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
