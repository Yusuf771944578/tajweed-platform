<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شجرة الأحكام — خريطة الإتقان التفاعلية</title>
<link rel="stylesheet" href="assets/app.css?v=10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif}
.fq{font-family:'Amiri Quran',serif}
#mapWrap{overflow:hidden;position:relative;touch-action:pan-x pan-y;cursor:grab;border-radius:1rem}
#mapWrap.grabbing{cursor:grabbing}
#map{position:relative;transform-origin:0 0;min-width:100%}
#links{position:absolute;inset:0;pointer-events:none;overflow:visible}
.node{transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.node:not(.locked):hover{transform:translateY(-4px)}
.pulse{animation:pl 2s infinite}@keyframes pl{0%,100%{opacity:.4}50%{opacity:1}}
.fade{animation:fd .25s ease both}@keyframes fd{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;transition:all .3s;z-index:70;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.badge{transition:all .2s}.badge.off{filter:grayscale(1);opacity:.45}
.opt{transition:all .15s}
</style>
</head>
<body class="bg-[#0B1020] text-slate-100 min-h-screen">
<div class="max-w-6xl mx-auto p-4 md:p-8" id="app">

<header class="rounded-2xl border border-white/10 bg-white/[.04] p-4 md:p-5">
<div class="flex flex-wrap justify-between items-center gap-3">
<div><h1 class="text-xl md:text-2xl font-extrabold">شجرة الأحكام <span class="text-emerald-400">— خريطة الإتقان</span></h1>
<p id="sub" class="text-xs text-slate-400 mt-1"></p></div>
<div class="flex gap-2 text-xs font-bold flex-wrap">
<span id="hxp" class="rounded-full bg-amber-400/10 border border-amber-400/30 px-3 py-1 text-amber-300"></span>
<span id="hst" class="rounded-full bg-orange-500/10 border border-orange-500/30 px-3 py-1 text-orange-300"></span>
<span id="hrk" class="rounded-full bg-violet-500/10 border border-violet-500/30 px-3 py-1 text-violet-300"></span>
<button id="tchBtn" onclick="toggleTeacher()" class="rounded-full bg-white/5 border border-white/10 px-3 py-1 text-slate-300">👨‍🏫 وضع المعلم</button>
</div>
</div>
<div class="mt-3 h-2 rounded-full bg-white/10 overflow-hidden"><div id="bar" class="h-full rounded-full bg-gradient-to-l from-emerald-400 to-sky-400" style="width:0;transition:width .8s"></div></div>
<div class="mt-3 flex gap-2 flex-wrap items-center" id="filters"></div>
<p class="mt-2 text-[11px] text-slate-500">💡 اسحب الخريطة للتنقل • عجلة/زرا + و− للتقريب • أتقن عقدة لتفتح ما بعدها • عد يومياً للحفاظ على السلسلة 🔥</p>
</header>

<div class="mt-4 grid gap-4 lg:grid-cols-[1fr_320px]">
<main class="rounded-2xl border border-white/10 bg-white/[.02] p-3 md:p-4">
<div class="flex gap-2 mb-2">
<button onclick="zoom(1.2)" class="rounded-lg bg-white/5 border border-white/10 px-3 py-1.5 text-sm font-bold">+</button>
<button onclick="zoom(0.85)" class="rounded-lg bg-white/5 border border-white/10 px-3 py-1.5 text-sm font-bold">−</button>
<button onclick="zoomReset()" class="rounded-lg bg-white/5 border border-white/10 px-3 py-1.5 text-xs font-bold">إعادة الضبط</button>
</div>
<div id="mapWrap"><div id="map"><svg id="links"></svg><div id="tiers"></div></div></div>
</main>
<aside class="lg:sticky lg:top-4 h-fit rounded-2xl border border-white/10 bg-white/[.04] p-5"><div id="detail"></div></aside>
</div>

<!-- الأوسمة -->
<section class="mt-4 rounded-2xl border border-white/10 bg-white/[.03] p-5">
<h2 class="font-extrabold">🏅 الأوسمة والشارات</h2>
<div id="badges" class="mt-3 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2"></div>
</section>

<!-- صندوق المراجعة -->
<section class="mt-4 rounded-2xl border border-white/10 bg-white/[.03] p-5">
<div class="flex justify-between items-center flex-wrap gap-2">
<h2 class="font-extrabold">📦 صندوق المراجعة <span class="text-xs text-slate-400 font-bold">(أخطاؤك السابقة للتدرب عليها)</span></h2>
<button onclick="clearVault()" class="rounded-xl bg-white/5 border border-white/10 px-4 py-1.5 text-xs font-bold">مسح السجل</button>
</div>
<div id="vault" class="mt-3 space-y-2"></div>
</section>

<!-- وضع المعلم -->
<section id="teacher" class="mt-4 rounded-2xl border border-violet-500/30 bg-violet-500/5 p-5" style="display:none">
<h2 class="font-extrabold">👨‍🏫 لوحة المعلم <span class="text-[11px] text-slate-400">(بيانات تجريبية للعرض)</span></h2>
<div id="roster" class="mt-3 grid gap-2 md:grid-cols-2"></div>
<div class="mt-4 rounded-xl bg-black/20 border border-white/10 p-4">
<h3 class="text-sm font-extrabold">📝 إسناد واجب منزلي</h3>
<div class="mt-2 flex gap-2 flex-wrap">
<select id="hwNode" class="rounded-xl border border-white/10 bg-black/30 px-3 py-2 text-sm font-bold outline-none"></select>
<button onclick="makeHW()" class="rounded-xl bg-violet-500 px-5 py-2 text-sm font-extrabold text-white">إنشاء الواجب</button>
</div>
<div id="hwList" class="mt-2 space-y-1 text-xs"></div>
</div>
</section>
</div>

<div id="modal"></div>
<div id="toast" class="rounded-xl bg-emerald-500 text-white px-6 py-3 text-sm font-extrabold shadow-lg"></div>

<script src="assets/xp.js?v=6"></script>
<script src="assets/site.js?v=9"></script>
<script>
/* ================= البيانات ================= */
var NODES=[
{id:'n-noon',t:'مدخل النون الساكنة',s:'الفرق بين السكون والتنوين',st:'MIDDLE',tier:0,xp:50,l:3,min:10,req:[],rule:'noon',ex:'كِتَابٌ — تنوين الضم'},
{id:'n-makh',t:'مخارج الحروف',s:'الحلق واللسان والشفتان',st:'MIDDLE',tier:0,xp:50,l:4,min:12,req:[],rule:'makharij',ex:'حروف الحلق: ء هـ ع ح غ خ'},
{id:'n-izhar',t:'الإظهار الحلقي',s:'ء هـ ع ح غ خ',st:'MIDDLE',tier:1,xp:80,l:5,min:15,req:['n-noon'],rule:'izhar',ex:'مِنْ خَشْيَةِ ٱللَّهِ'},
{id:'n-idgham',t:'الإدغام',s:'بغنة وبغير غنة — يرملون',st:'MIDDLE',tier:1,xp:100,l:6,min:20,req:['n-noon'],rule:'idgham',ex:'مَن يَقُولُ'},
{id:'n-iqlab',t:'الإقلاب',s:'النون + الباء ← ميم مخفاة',st:'HIGH',tier:1,xp:100,l:4,min:15,req:['n-noon'],rule:'iqlab',ex:'مِن بَعْدِ'},
{id:'n-ikhfa',t:'الإخفاء الحقيقي',s:'15 حرفاً + غنة حركتين',st:'HIGH',tier:2,xp:120,l:6,min:25,req:['n-idgham','n-iqlab'],rule:'ikhfa',ex:'مِن فَضْلِ ٱللَّهِ'},
{id:'n-ghunna',t:'أزمنة الغنة',s:'النون والميم المشددتين',st:'HIGH',tier:2,xp:150,l:4,min:20,req:['n-ikhfa'],rule:'ghunna',ex:'إِنَّ ٱللَّهَ'},
{id:'n-meem',t:'أحكام الميم الساكنة',s:'إخفاء شفوي • إدغام • إظهار',st:'HIGH',tier:2,xp:120,l:5,min:20,req:['n-izhar'],rule:'meem',ex:'هُم بِهِ'},
{id:'n-madd',t:'المدود',s:'طبيعي • متصل • منفصل • عارض',st:'UNIVERSITY',tier:3,xp:180,l:8,min:30,req:['n-ikhfa','n-meem'],rule:'madd',ex:'قَالُوا'},
{id:'n-qalq',t:'القلقلة',s:'قطب جد — صغرى وكبرى',st:'UNIVERSITY',tier:3,xp:150,l:4,min:15,req:['n-meem'],rule:'qalqalah',ex:'قُلْ هُوَ'},
{id:'n-itqan',t:'الإتقان الشامل',s:'تطبيق شامل على جزء عم',st:'UNIVERSITY',tier:4,xp:300,l:10,min:45,req:['n-madd','n-qalq'],rule:'itqan',ex:'مراجعة كل الأبواب'}];
var SL={MIDDLE:'الإعدادية',HIGH:'الثانوية',UNIVERSITY:'الجامعية'};
var BANK={
noon:{click:{p:'انقر الكلمة التي فيها نون ساكنة',w:[['يَنْهَوْنَ',1],['آمَنُوا',0]]},m:[{q:'ما التنوين؟',o:['نون ساكنة تلحق آخر الاسم لفظاً لا خطاً','نون أصلية في الكلمة','حرف مد'],c:0},{q:'النون الساكنة توجد في…',o:['الأسماء والأفعال والحروف','الأسماء فقط','آخر الكلمات فقط'],c:0}]},
makharij:{click:{p:'انقر حرفاً من حروف الحلق',w:[['خ',1],['ب',0],['م',0]]},m:[{q:'من مخارج الحروف الرئيسية…',o:['الحلق واللسان والشفتان والجوف','الحلق فقط','اللسان فقط'],c:0},{q:'مخرج الخاء والغين؟',o:['أدنى الحلق','طرف اللسان','الشفتان'],c:0}]},
izhar:{click:{p:'انقر كلمة الإظهار الحلقي',w:[['مِنْ',0],['خَشْيَةِ',1],['ٱللَّهِ',0]]},m:[{q:'ما حكم النون في ﴿مِنْ خَشْيَةِ﴾؟',o:['إظهار حلقي','إدغام','إخفاء'],c:0},{q:'سُمّي حلقياً لأن حروفه…',o:['تخرج من الحلق','تخرج من اللسان','فيها غنة'],c:0}]},
idgham:{click:{p:'انقر كلمة الإدغام',w:[['مَن',0],['يَقُولُ',1]]},m:[{q:'حروف الإدغام مجموعة في…',o:['يرملون','قطب جد','ء هـ ع ح غ خ'],c:0},{q:'الإدغام بغير غنة مع…',o:['اللام والراء','الياء والنون','الميم والواو'],c:0}]},
iqlab:{click:{p:'انقر كلمة الإقلاب',w:[['مِن',0],['بَعْدِ',1]]},m:[{q:'حرف الإقلاب الوحيد؟',o:['الباء','الميم','الفاء'],c:0},{q:'تُقلب النون الساكنة إلى…',o:['ميم مخفاة بغنة','نون مشددة','تُحذف'],c:0}]},
ikhfa:{click:{p:'انقر كلمة الإخفاء',w:[['مِن',0],['فَضْلِ',1]]},m:[{q:'عدد حروف الإخفاء الحقيقي؟',o:['15 حرفاً','6 حروف','4 حروف'],c:0},{q:'مقدار الغنة في الإخفاء؟',o:['حركتان','4 حركات','بدون غنة'],c:0}]},
ghunna:{click:{p:'انقر النون المشددة (أكمل الغنن)',w:[['إِنَّ',1],['مِن',0]]},m:[{q:'أكمل مراتب الغنة في…',o:['النون والميم المشددتين','التنوين فقط','حروف المد'],c:0},{q:'مقدار غنة المشدد؟',o:['حركتان','حركة','4 حركات'],c:0}]},
meem:{click:{p:'انقر موضع الإخفاء الشفوي',w:[['هُم',0],['بِهِ',1]]},m:[{q:'أحكام الميم الساكنة ثلاثة وهي…',o:['إخفاء شفوي وإدغام وإظهار','إظهار وإدغام وقلب','مد وغنة وقلقلة'],c:0},{q:'الإخفاء الشفوي يكون مع…',o:['الباء','الفاء','الميم'],c:0}]},
madd:{click:{p:'انقر الكلمة الممدودة',w:[['قَالُوا',1],['كَتَبَ',0]]},m:[{q:'حروف المد ثلاثة وهي…',o:['الألف والواو والياء','الهمزة والهاء','النون والميم'],c:0},{q:'مقدار المد الطبيعي؟',o:['حركتان','4 حركات','6 حركات'],c:0}]},
qalqalah:{click:{p:'انقر الحرف المقلقَل',w:[['قُلْ',1],['هُوَ',0]]},m:[{q:'حروف القلقلة مجموعة في…',o:['قطب جد','يرملون','حي طهر'],c:0},{q:'حكم القاف الساكنة في ﴿قُلْ﴾؟',o:['قلقلة صغرى','قلقلة كبرى','إظهار'],c:0}]},
itqan:{click:{p:'انقر كلمة الإظهار',w:[['مِنْ',0],['خَشْيَةِ',1]]},m:[{q:'الغنة صفة لازمة لـ…',o:['النون والميم','الراء واللام','حروف المد'],c:0},{q:'أقوى حروف الاستعلاء؟',o:['الطاء','الهمزة','الهاء'],c:0}]}};
var BADGES=[
{id:'b_first',t:'الخطوة الأولى',d:'أكمل أول عقدة',i:'🌱'},
{id:'b_noon',t:'خبير النون الساكنة',d:'أتقن الإظهار والإدغام والإقلاب والإخفاء',i:'🟢'},
{id:'b_madd',t:'بطل المدود',d:'أتقن عقدة المدود',i:'📏'},
{id:'b_qal',t:'متقن القلقلة',d:'أتقن عقدة القلقلة',i:'🔔'},
{id:'b_xp500',t:'صاحب الـ500',d:'اجمع 500 XP',i:'⚡'},
{id:'b_streak7',t:'المثابر',d:'حافظ على سلسلة 7 أيام',i:'🔥'}];
var ROSTER=[
{n:'أحمد (تجريبي)',done:8,weak:'الإدغام بغنة'},
{n:'سارة (تجريبي)',done:5,weak:'المدود'},
{n:'خالد (تجريبي)',done:3,weak:'الإخفاء'},
{n:'ليلى (تجريبي)',done:10,weak:'لا شيء — ممتازة'}];

/* ================= المخازن المحلية ================= */
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var PROG=load('tajweed_tree_v1',{nodes:{},badges:[],mistakes:[],hw:[]});
function nodeSt(n){
  var p=PROG.nodes[n.id];
  var m=p?p.m:0;
  if(m>=0.7){
    var bad=PROG.mistakes.some(function(x){return x.n===n.id});
    return bad?'review':'completed';
  }
  var open=n.req.every(function(r){var q=PROG.nodes[r];return q&&q.m>=0.7});
  if(!open)return 'locked';
  return (p&&p.att>0)?'in-progress':'available';
}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove('show')},2600)}

/* ================= العرض ================= */
var F='ALL',SEL='n-noon',VW={x:0,y:0,k:1};
var CLS={completed:'border-emerald-500/60 bg-emerald-500/10',review:'border-orange-400/60 bg-orange-400/10','in-progress':'border-sky-500/60 bg-sky-500/10',available:'border-amber-400/50 bg-amber-400/5',locked:'border-white/10 bg-white/[.03]'};
var BDG={completed:'<span class="rounded-full bg-emerald-500/20 px-2 py-0.5 text-[10px] font-bold text-emerald-300">✓ مكتمل</span>',review:'<span class="rounded-full bg-orange-400/15 px-2 py-0.5 text-[10px] font-bold text-orange-300">🔄 يحتاج مراجعة</span>','in-progress':'<span class="rounded-full bg-sky-500/20 px-2 py-0.5 text-[10px] font-bold text-sky-300">جارٍ التقدم</span>',available:'<span class="rounded-full bg-amber-400/15 px-2 py-0.5 text-[10px] font-bold text-amber-300">▶ متاح الآن</span>',locked:'<span class="rounded-full bg-white/5 px-2 py-0.5 text-[10px] font-bold text-slate-500">🔒 مغلق</span>'};
function render(){
  var done=NODES.filter(function(n){return nodeSt(n)==='completed'||nodeSt(n)==='review'}).length;
  document.getElementById('sub').textContent='أتقن عقدة لتفتح ما بعدها — '+done+' من '+NODES.length+' مكتملة';
  document.getElementById('bar').style.width=Math.round(done/NODES.length*100)+'%';
  try{
    document.getElementById('hxp').textContent='⚡ '+XP.get()+' XP';
    document.getElementById('hst').textContent='🔥 سلسلة '+XP.streak()+' يوم';
    document.getElementById('hrk').textContent='🎖 '+XP.rank();
  }catch(e){}
  document.getElementById('filters').innerHTML=['ALL','MIDDLE','HIGH','UNIVERSITY'].map(function(s){
    return '<button onclick="F=\''+s+'\';render()" class="rounded-full px-4 py-1.5 text-xs font-bold '+(F===s?'bg-emerald-500 text-white':'bg-white/5 hover:bg-white/10')+'">'+(s==='ALL'?'الكل':SL[s])+'</button>';
  }).join('');
  var list=NODES.filter(function(n){return F==='ALL'||n.st===F});
  var tiers={};list.forEach(function(n){(tiers[n.tier]=tiers[n.tier]||[]).push(n)});
  var keys=Object.keys(tiers).sort();
  document.getElementById('tiers').innerHTML=keys.map(function(t){
    return '<div class="mb-2 flex items-center gap-3"><span class="text-[11px] font-bold text-slate-500">المستوى '+(+t+1)+'</span><div class="h-px flex-1 bg-white/10"></div></div>'+
    '<div class="mb-5 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">'+tiers[t].map(cardHTML).join('')+'</div>';
  }).join('');
  applyT();requestAnimationFrame(drawLinks);
  renderDetail();renderBadges();renderVault();renderHWNode();
}
function cardHTML(n){
  var s=nodeSt(n),p=PROG.nodes[n.id],m=p?p.m:0;
  return '<button id="nd-'+n.id+'" onclick="if(window._mm)return;SEL=\''+n.id+'\';render()" class="node '+(s==='locked'?'locked':'')+' '+CLS[s]+(SEL===n.id?' ring-2 ring-emerald-400':'')+' relative rounded-2xl border p-4 text-right '+(s==='locked'?'cursor-not-allowed':'cursor-pointer')+'">'+
  (s==='available'?'<span class="pulse absolute left-3 top-3 h-2 w-2 rounded-full bg-amber-400"></span>':'')+
  '<div class="flex justify-between items-start gap-2"><div class="h-11 w-11 flex items-center justify-center rounded-xl bg-black/30 text-lg font-extrabold">'+(s==='locked'?'🔒':s==='completed'?'✓':s==='review'?'🔄':'◈')+'</div>'+
  '<div class="flex flex-col items-end gap-1">'+BDG[s]+'<span class="text-[10px] text-slate-400">'+SL[n.st]+'</span></div></div>'+
  '<h3 class="mt-3 font-extrabold '+(s==='locked'?'text-slate-500':'')+'">'+n.t+'</h3><p class="text-xs text-slate-400">'+n.s+'</p>'+
  (m>0?'<div class="mt-3 h-1.5 rounded-full bg-black/40 overflow-hidden"><div class="h-full rounded-full '+(m>=0.7?'bg-emerald-400':'bg-sky-400')+'" style="width:'+Math.round(m*100)+'%"></div></div>':'')+
  '<div class="mt-2 flex justify-between text-[11px] text-slate-400"><span>⚡ '+n.xp+' XP</span><span>'+n.l+' دروس • '+n.min+' د</span></div></button>';
}
function renderDetail(){
  var n=NODES.find(function(x){return x.id===SEL}),s=nodeSt(n),p=PROG.nodes[n.id]||{m:0,att:0,best:0};
  var req=n.req.map(function(r){var d=NODES.find(function(x){return x.id===r});var ok=(PROG.nodes[r]||{m:0}).m>=0.7;
    return '<span class="inline-block rounded-full px-2 py-0.5 font-bold mr-1 '+(ok?'bg-emerald-500/15 text-emerald-300':'bg-white/5 text-slate-400')+'">'+(ok?'✓ ':'🔒 ')+d.t+'</span>'}).join('');
  document.getElementById('detail').innerHTML='<div class="fade">'+
  '<h2 class="text-lg font-extrabold">'+n.t+'</h2><p class="text-xs text-slate-400">'+n.s+' • '+SL[n.st]+'</p>'+
  '<div class="mt-3 rounded-xl bg-black/20 border border-white/10 p-3"><div class="text-[11px] text-slate-400 font-bold">ملخص الحكم + مثال صوتي</div>'+
  '<div class="fq text-xl mt-1 leading-loose">'+n.ex+'</div>'+
  '<button onclick="speakEx()" class="mt-1 rounded-lg bg-white/5 border border-white/10 px-3 py-1.5 text-xs font-bold">🔊 استماع للمثال</button></div>'+
  '<div class="mt-3 grid grid-cols-3 gap-2 text-center">'+
  '<div class="rounded-xl bg-black/30 p-2.5"><div class="text-lg font-extrabold text-amber-300">⚡'+n.xp+'</div><div class="text-[10px] text-slate-400">XP</div></div>'+
  '<div class="rounded-xl bg-black/30 p-2.5"><div class="text-lg font-extrabold">'+Math.round(p.m*100)+'%</div><div class="text-[10px] text-slate-400">الإتقان</div></div>'+
  '<div class="rounded-xl bg-black/30 p-2.5"><div class="text-lg font-extrabold">'+p.att+'</div><div class="text-[10px] text-slate-400">محاولات</div></div></div>'+
  (req?'<div class="mt-3 text-xs"><b>المتطلبات:</b><br>'+req+'</div>':'')+
  (s==='locked'?'<button disabled class="mt-4 w-full rounded-xl bg-white/5 py-3 text-sm font-bold text-slate-500 cursor-not-allowed">🔒 مغلق — أتقن المتطلبات أولاً</button>'
  :'<button onclick="openChallenge(\''+n.id+'\')" class="mt-4 w-full rounded-xl bg-emerald-500 py-3 text-sm font-extrabold text-white hover:bg-emerald-400">'+(s==='completed'||s==='review'?'🔄 تحدي المراجعة':'▶ ابدأ تحدي العقدة +'+n.xp+' XP')+'</button>'+
  '<a href="demo-lesson.html" class="mt-2 block text-center rounded-xl bg-white/5 border border-white/10 py-2.5 text-xs font-bold">📖 أو ادرس الدرس الكامل أولاً</a>')+'</div>';
}
function speakEx(){var n=NODES.find(function(x){return x.id===SEL});try{var u=new SpeechSynthesisUtterance(n.ex);u.lang='ar-SA';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

/* ================= الخريطة: وصلات + تحريك + تقريب ================= */
function applyT(){document.getElementById('map').style.transform='translate('+VW.x+'px,'+VW.y+'px) scale('+VW.k+')'}
function zoom(f){VW.k=Math.min(1.8,Math.max(.5,VW.k*f));applyT()}
function zoomReset(){VW={x:0,y:0,k:1};applyT()}
function drawLinks(){
  var map=document.getElementById('map'),svg=document.getElementById('links');
  var mr=map.getBoundingClientRect();
  svg.setAttribute('width',map.scrollWidth);svg.setAttribute('height',map.scrollHeight);
  var h='';
  NODES.forEach(function(n){
    var el=document.getElementById('nd-'+n.id);if(!el)return;
    var r=el.getBoundingClientRect();
    var x2=(r.left-mr.left)/VW.k+r.width/VW.k/2,y2=(r.top-mr.top)/VW.k;
    n.req.forEach(function(q){
      var p=document.getElementById('nd-'+q);if(!p)return;
      var pr=p.getBoundingClientRect();
      var x1=(pr.left-mr.left)/VW.k+pr.width/VW.k/2,y1=(pr.top-mr.top)/VW.k+pr.height/VW.k;
      var s=nodeSt(n),col=s==='locked'?'rgba(148,163,184,.3)':s==='completed'||s==='review'?'rgba(52,211,153,.6)':'rgba(251,191,36,.55)';
      h+='<path d="M'+x1+' '+y1+' C'+x1+' '+(y1+34)+','+x2+' '+(y2-34)+','+x2+' '+y2+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-dasharray="'+(s==='locked'?'5 5':'none')+'"/>';
    });
  });
  svg.innerHTML=h;
}
(function(){
  var wrap=null,sx=0,sy=0,ox=0,oy=0,drag=false;
  document.addEventListener('pointerdown',function(e){
    wrap=document.getElementById('mapWrap');
    if(wrap&&wrap.contains(e.target)){drag=true;sx=e.clientX;sy=e.clientY;ox=VW.x;oy=VW.y;window._mm=false;wrap.classList.add('grabbing')}
  });
  document.addEventListener('pointermove',function(e){
    if(!drag)return;
    var dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>6)window._mm=true;
    VW.x=ox+dx;VW.y=oy+dy;applyT();
  });
  document.addEventListener('pointerup',function(){drag=false;if(wrap)wrap.classList.remove('grabbing');setTimeout(function(){window._mm=false},50)});
  window.addEventListener('resize',function(){drawLinks()});
})();

/* ================= تحدي العقدة ================= */
var CH=null;
function openChallenge(id){
  var n=NODES.find(function(x){return x.id===id}),b=BANK[n.rule];
  CH={n:n,step:0,score:0,answers:[],qs:[
    {t:'click',p:b.click.p,w:b.click.w},
    {t:'mcq',q:b.m[0].q,o:b.m[0].o,c:b.m[0].c},
    {t:'mcq',q:b.m[1].q,o:b.m[1].o,c:b.m[1].c}]};
  renderCH();
}
function renderCH(){
  var m=document.getElementById('modal'),q=CH.qs[CH.step],n=CH.n;
  var body='';
  if(q.t==='click'){
    body='<p class="text-sm font-bold">'+q.p+'</p><div class="fq mt-3 text-4xl leading-[2.2]">'+q.w.map(function(w,i){
      return '<button onclick="answerClick('+i+','+w[1]+')" class="mx-2 px-4 py-1 rounded-xl bg-black/30 border border-white/10 hover:border-emerald-400/60">'+w[0]+'</button>'}).join('')+'</div>';
  }else{
    body='<p class="text-sm font-bold">'+q.q+'</p><div class="mt-3 space-y-2">'+q.o.map(function(o,i){
      return '<button onclick="answerMcq('+i+','+q.c+')" class="opt w-full rounded-xl border border-white/10 bg-white/5 px-3 py-2.5 text-right text-sm hover:border-white/25">'+o+'</button>'}).join('')+'</div>';
  }
  m.innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="fade w-full max-w-md rounded-2xl border border-white/10 bg-[#141b31] p-6">'+
  '<div class="flex justify-between items-center"><b>'+n.t+' — سؤال '+(CH.step+1)+'/3</b><button onclick="closeModal()" class="text-slate-400 font-bold">✕</button></div>'+
  '<div class="mt-2 h-1.5 rounded-full bg-white/10 overflow-hidden"><div class="h-full bg-emerald-400" style="width:'+(CH.step/3*100)+'%"></div></div>'+
  '<div class="mt-4">'+body+'</div></div></div>';
}
function closeModal(){document.getElementById('modal').innerHTML=''}
function pushMistake(qtext,ok){
  if(PROG.mistakes.some(function(x){return x.q===qtext}))return;
  PROG.mistakes.push({n:CH.n.id,r:CH.n.rule,q:qtext,ok:ok,ts:Date.now()});
}
function answerClick(i,ok){
  var q=CH.qs[CH.step];
  if(ok){CH.score++;toast('✓ إجابة صحيحة')}
  else{toast('✗ راجع القاعدة');pushMistake(q.p+' ('+CH.n.ex+')',q.w.find(function(w){return w[1]} )[0])}
  nextCH();
}
function answerMcq(i,c){
  var q=CH.qs[CH.step];
  if(i===c){CH.score++;toast('✓ إجابة صحيحة')}
  else{toast('✗ الإجابة: '+q.o[c]);pushMistake(q.q,q.o[c])}
  nextCH();
}
function nextCH(){
  CH.step++;
  if(CH.step>=CH.qs.length)finishCH();
  else renderCH();
}
function finishCH(){
  var n=CH.n,sc=Math.round(CH.score/CH.qs.length*100)/100;
  var p=PROG.nodes[n.id]||{m:0,att:0,best:0};
  var first=p.att===0;
  p.att++;p.best=Math.max(p.best,sc);p.m=Math.max(p.m,sc);
  PROG.nodes[n.id]=p;
  var gain=first?Math.round(n.xp*sc):Math.round(n.xp*0.1*sc);
  try{if(gain>0)XP.add(gain)}catch(e){}
  save('tajweed_tree_v1',PROG);
  checkBadges();
  document.getElementById('modal').innerHTML='<div class="modal-bg"><div class="fade w-full max-w-md rounded-2xl border border-white/10 bg-[#141b31] p-8 text-center">'+
  '<div class="text-5xl">'+(sc>=0.7?'🎉':'💪')+'</div><h2 class="text-xl font-extrabold mt-2">'+(sc>=0.7?'أتقنت العقدة!':'نتيجة '+Math.round(sc*100)+'% — أعد التحدي للإتقان')+'</h2>'+
  '<p class="text-sm text-slate-400 mt-1">+'+gain+' XP في رصيدك</p>'+
  '<button onclick="closeModal();render()" class="mt-4 w-full rounded-xl bg-emerald-500 py-3 text-sm font-extrabold">عودة للخريطة ✓</button></div></div>';
  render();
}
function checkBadges(){
  var has=function(id){return PROG.badges.indexOf(id)>-1},give=function(id,t){if(!has(id)){PROG.badges.push(id);save('tajweed_tree_v1',PROG);toast('🏅 وسام جديد: '+t)}};
  var c=function(id){var p=PROG.nodes[id];return p&&p.m>=0.7};
  if(Object.keys(PROG.nodes).length>0)give('b_first','الخطوة الأولى 🌱');
  if(c('n-izhar')&&c('n-idgham')&&c('n-iqlab')&&c('n-ikhfa'))give('b_noon','خبير النون الساكنة 🟢');
  if(c('n-madd'))give('b_madd','بطل المدود 📏');
  if(c('n-qalq'))give('b_qal','متقن القلقلة 🔔');
  try{
    if(XP.get()>=500)give('b_xp500','صاحب الـ500 ⚡');
    if(XP.streak()>=7)give('b_streak7','المثابر 🔥');
  }catch(e){}
}
function renderBadges(){
  document.getElementById('badges').innerHTML=BADGES.map(function(b){
    var on=PROG.badges.indexOf(b.id)>-1;
    return '<div class="badge '+(on?'':'off')+' rounded-xl border p-3 text-center '+(on?'border-amber-300/50 bg-amber-400/5':'border-white/10 bg-white/[.02]')+'">'+
    '<div class="text-2xl">'+b.i+'</div><div class="mt-1 text-xs font-extrabold">'+b.t+'</div><div class="text-[10px] text-slate-400">'+b.d+'</div></div>';
  }).join('');
}
function renderVault(){
  var v=document.getElementById('vault');
  if(!PROG.mistakes.length){v.innerHTML='<p class="text-sm text-slate-500">صندوقك فارغ — أحسنت! ستظهر هنا الأسئلة التي تخطئ فيها لتراجعها.</p>';return}
  v.innerHTML=PROG.mistakes.slice().reverse().map(function(m,i){
    var n=NODES.find(function(x){return x.id===m.n});
    return '<div class="fade flex items-center gap-2 rounded-xl border border-white/10 bg-white/[.02] p-3 text-xs flex-wrap">'+
    '<span class="font-bold text-orange-300">✗ '+m.q+'</span><span class="text-emerald-300">✓ '+m.ok+'</span>'+
    '<button onclick="SEL=\''+m.n+'\';openChallenge(\''+m.n+'\')" class="mr-auto rounded-lg bg-emerald-500 px-4 py-1.5 font-bold text-white">تدرب الآن</button></div>';
  }).join('');
}
function clearVault(){PROG.mistakes=[];save('tajweed_tree_v1',PROG);renderVault();render()}

/* ================= وضع المعلم ================= */
function toggleTeacher(){
  var el=document.getElementById('teacher'),open=el.style.display!=='none';
  el.style.display=open?'none':'block';
  document.getElementById('tchBtn').textContent=open?'👨‍🏫 وضع المعلم':'✕ إغلاق لوحة المعلم';
  if(!open){
    document.getElementById('roster').innerHTML=ROSTER.map(function(s){
      var pc=Math.round(s.done/NODES.length*100);
      return '<div class="rounded-xl border border-white/10 bg-black/20 p-3"><div class="flex justify-between text-xs font-bold"><span>'+s.n+'</span><span>'+s.done+'/'+NODES.length+'</span></div>'+
      '<div class="mt-2 h-2 rounded-full bg-white/10 overflow-hidden"><div class="h-full rounded-full bg-violet-400" style="width:'+pc+'%"></div></div>'+
      '<div class="mt-1 text-[11px] text-slate-400">يحتاج دعماً في: '+s.weak+'</div></div>';
    }).join('');
    renderHW();
  }
}
function renderHWNode(){
  var s=document.getElementById('hwNode');
  if(s)s.innerHTML=NODES.map(function(n){return '<option value="'+n.id+'">'+n.t+'</option>'}).join('');
}
function makeHW(){
  var id=document.getElementById('hwNode').value,n=NODES.find(function(x){return x.id===id});
  var code='HW-'+Math.random().toString(36).slice(2,6).toUpperCase();
  PROG.hw.push({code:code,node:n.t,ts:Date.now()});save('tajweed_tree_v1',PROG);renderHW();
  toast('تم إنشاء الواجب '+code);
}
function renderHW(){
  var el=document.getElementById('hwList');if(!el)return;
  el.innerHTML=PROG.hw.length?PROG.hw.slice().reverse().map(function(h){
    return '<div class="rounded-lg bg-black/30 border border-white/10 p-2">📌 <b>'+h.code+'</b> — '+h.node+' <button onclick="copyHW(\''+h.code+'\')" class="text-emerald-300 font-bold">نسخ</button></div>';
  }).join(''):'<p class="text-slate-500">لا واجبات بعد — اختر عقدة وأنشئ أول واجب.</p>';
}
function copyHW(c){try{navigator.clipboard.writeText('واجب التجويد '+c+': افتح demo-lesson.html وأكمل الدرس')}catch(e){}toast('نُسخ الواجب '+c)}
render();
</script>
</body>
