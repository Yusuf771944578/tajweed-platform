<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الصدارة - منصة تعلم التجويد</title>
<link rel="stylesheet" href="assets/app.css?v=11">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:'IBM Plex Sans Arabic',sans-serif}</style>
</head>
<body class="bg-[#0B1020] text-slate-100 min-h-screen p-4 md:p-8">
<div class="max-w-4xl mx-auto" id="app">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-extrabold">لوحة الصدارة <span class="text-amber-300">العالمية</span></h1>
    <a href="index.html" class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-xs font-bold hover:bg-white/10">العودة للرئيسية</a>
  </div>
  
  <div class="rounded-2xl border border-white/10 bg-white/[.04] p-6 mb-6">
    <h2 class="text-sm font-bold mb-2">سجل اسمك في لوحة الصدارة</h2>
    <div class="flex gap-2">
      <input id="nm" placeholder="اكتب اسمك الثلاثي..." class="flex-1 rounded-xl border border-white/10 bg-black/30 px-4 py-2 text-sm outline-none focus:border-emerald-500">
      <button onclick="saveName()" class="rounded-xl bg-emerald-500 px-6 py-2 text-sm font-bold text-black hover:bg-emerald-400">حفظ الاسم</button>
    </div>
  </div>

  <div id="leaderboard-list" class="space-y-3">
    <!-- سيتم تعبئة لوحة الصدارة هنا -->
  </div>
</div>

<script>
function saveName() {
  var v = document.getElementById('nm').value.trim();
  if(!v) return;
  try {
    localStorage.setItem('tajweed_name', v);
    alert('تم حفظ الاسم بنجاح!');
    location.reload();
  } catch(e) {}
}

function loadLeaderboard() {
  var name = '';
  try { name = localStorage.getItem('tajweed_name') || 'زائر (أنت)'; } catch(e) { name = 'زائر (أنت)'; }
  
  var xp = 150;
  try { xp = parseInt(localStorage.getItem('tajweed_xp') || '150'); } catch(e) {}

  var users = [
    {n: name, xp: xp, r: 'طالب مجتهد', s: 5, y: true},
    {n: 'الشيخ عبد الله', xp: 1250, r: 'متقن', s: 20, y: false},
    {n: 'أبو بكر الصديق', xp: 980, r: 'متقدم', s: 14, y: false},
    {n: 'عمر الفاروق', xp: 850, r: 'متقدم', s: 12, y: false},
    {n: 'عثمان بن عفان', xp: 720, r: 'متوسط', s: 9, y: false},
    {n: 'علي بن أبي طالب', xp: 640, r: 'متوسط', s: 7, y: false}
  ];

  users.sort(function(a, b) { return b.xp - a.xp; });

  var html = '<div class="grid gap-3">';
  for(var i = 0; i < users.length; i++) {
    var u = users[i];
    var medal = i === 0 ? '🥇' : (i === 1 ? '🥈' : (i === 2 ? '🥉' : '#' + (i + 1)));
    var bg = u.y ? 'border-emerald-500/50 bg-emerald-500/10' : 'border-white/10 bg-white/[.03]';
    html += '<div class="flex items-center gap-4 rounded-xl border ' + bg + ' p-4">' +
      '<span class="w-10 text-center text-lg font-extrabold text-amber-300">' + medal + '</span>' +
      '<div class="h-10 w-10 rounded-full bg-white/10 flex items-center justify-center font-extrabold text-emerald-400">' + u.n[0] + '</div>' +
      '<div class="flex-1">' +
        '<div class="text-sm font-bold text-white">' + u.n + (u.y ? ' (أنت)' : '') + '</div>' +
        '<div class="text-xs text-slate-400">' + u.r + ' • ' + u.s + ' أيام متتالية</div>' +
      '</div>' +
      '<span class="font-extrabold text-amber-300 text-base">' + u.xp + ' XP</span>' +
    '</div>';
  }
  html += '</div>';
  document.getElementById('leaderboard-list').innerHTML = html;
}

loadLeaderboard();
</script>
</body>
</html>
