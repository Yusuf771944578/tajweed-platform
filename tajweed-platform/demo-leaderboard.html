<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الصدارة - منصة تعلم التجويد</title>
<link rel="stylesheet" href="assets/app.css?v=13">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:'IBM Plex Sans Arabic',sans-serif}</style>
</head>
<body class="bg-[#0B1020] text-slate-100 min-h-screen p-4 md:p-8">
<div class="max-w-4xl mx-auto" id="app">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-extrabold">لوحة الصدارة <span class="text-amber-300">العالمية</span></h1>
    <span class="flex gap-2"><a href="demo-skill-tree.html" class="rounded-xl border border-emerald-500/40 bg-emerald-500/10 px-4 py-2 text-xs font-bold text-emerald-300 hover:bg-emerald-500/20">🌳 الشجرة</a><a href="index.html" class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-xs font-bold hover:bg-white/10">العودة للرئيسية</a></span>
  </div>
  
  <div class="rounded-2xl border border-white/10 bg-white/[.04] p-6 mb-6">
    <h2 class="text-sm font-bold mb-2">سجل اسمك في لوحة الصدارة</h2>
    <div class="flex gap-2">
      <input id="nm" placeholder="اكتب اسمك الثلاثي..." class="flex-1 rounded-xl border border-white/10 bg-black/30 px-4 py-2 text-sm outline-none focus:border-emerald-500">
      <button onclick="saveName()" class="rounded-xl bg-emerald-500 px-6 py-2 text-sm font-bold text-black hover:bg-emerald-400">حفظ الاسم</button>
    </div>
  </div>

  <div id="leaderboard-list" class="space-y-3">
    <!-- سيتم تعبئة لوحة الصدارة هنا -->
  </div>
</div>

<script src="assets/xp.js?v=7"></script>
<script src="assets/site.js?v=17"></script>
<script src="assets/cloud.js?v=3"></script>
<script>
function getXP(){try{if(window.XP)return XP.get()}catch(e){}try{var v=parseInt(localStorage.getItem('tajweed_xp_v1')||localStorage.getItem('tajweed_xp')||'0',10);return v||0}catch(e){return 0}}
function getRank(){try{if(window.XP)return XP.rank()}catch(e){}var x=getXP();if(x>=5000)return'مجاز';if(x>=2000)return'متقن';if(x>=800)return'مجوّد';if(x>=300)return'قارئ';return'مبتدئ'}
function getStreak(){try{if(window.XP)return XP.streak()}catch(e){}try{return parseInt(localStorage.getItem('tajweed_streak_v1')||'0',10)||0}catch(e){return 0}}
function getName(){try{return localStorage.getItem('tajweed_name')||''}catch(e){return''}}
function saveName() {
  var v = document.getElementById('nm').value.trim();
  if(!v) return;
  try { localStorage.setItem('tajweed_name', v); } catch(e) {}
  loadLeaderboard();
}

function loadLeaderboard() {
  var name = getName() || 'زائر (أنت)';
  try { document.getElementById('nm').value = getName(); } catch(e) {}
  var xp = getXP(), rk = getRank(), st = getStreak();

  var html = '<div class="grid gap-3">';
  html += '<div class="flex items-center gap-4 rounded-xl border border-emerald-500/50 bg-emerald-500/10 p-4">' +
    '<span class="w-10 text-center text-lg font-extrabold text-amber-300">🥇</span>' +
    '<div class="h-10 w-10 rounded-full bg-white/10 flex items-center justify-center font-extrabold text-emerald-400">' + name[0] + '</div>' +
    '<div class="flex-1">' +
      '<div class="text-sm font-bold text-slate-100">' + name + '</div>' +
      '<div class="text-xs text-slate-400">' + rk + ' • 🔥 ' + st + ' أيام متتالية</div>' +
    '</div>' +
    '<span class="font-extrabold text-amber-300 text-base">' + xp + ' XP</span>' +
  '</div>';
  html += '</div>';
  if(!xp) {
    html += '<p class="mt-4 text-center text-sm text-slate-400">لم تجمع نقاطاً بعد — ابدأ من <a href="demo-skill-tree.html?v=13" class="font-bold text-emerald-300">شجرة الأحكام</a> وستظهر نقاطك هنا.</p>';
  } else {
    html += '<p class="mt-4 text-center text-xs text-slate-500">لوحة الصدارة العامة بين اللاعبين ستتوفر في نسخة الإنتاج — حالياً تُعرض نقاطك المحفوظة على جهازك.</p>';
  }
  document.getElementById('leaderboard-list').innerHTML = html;
}

loadLeaderboard();
</script>
</body>
</html>
