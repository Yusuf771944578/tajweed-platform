<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استوديو المعلم التفاعلي — عرض عملي</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
  .font-quran { font-family: 'Amiri Quran', 'KFGQPC Uthman Taha Naskh', serif; }
  .word { transition: all .35s cubic-bezier(.34,1.56,.64,1); cursor: pointer; }
  .word.noon { background: rgba(16,185,129,.15); color: #6ee7b7; outline: 2px solid rgba(16,185,129,.6); transform: scale(1.15) translateY(-6px); }
  .word.trigger { background: rgba(245,158,11,.15); color: #fcd34d; outline: 2px solid rgba(245,158,11,.6); transform: scale(1.15) translateY(-6px); }
  .word.qalq { background: rgba(244,63,94,.15); color: #fda4af; outline: 2px solid rgba(244,63,94,.6); transform: scale(1.15) translateY(-6px); }
  .word.ikhf { background: rgba(139,92,246,.18); color: #c4b5fd; outline: 2px solid rgba(139,92,246,.6); transform: scale(1.15) translateY(-6px); }
  @keyframes float { 0%,100%{transform:translateX(0)} 50%{transform:translateX(-8px)} }
  .arrow { animation: float 1.6s ease-in-out infinite; }
  .fade-in { animation: fadeIn .4s ease both; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
</style>
</head>
<body class="bg-[#0B1020] text-slate-100 min-h-screen">
<div class="max-w-5xl mx-auto p-4 md:p-8">
  <header class="flex flex-wrap justify-between items-center gap-3 mb-6">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold">استوديو المعلم التفاعلي <span class="text-emerald-400">— السبورة الديناميكية</span></h1>
      <p class="text-sm text-slate-400 mt-1">انقر أي مثال — لاحظ تحريك وتكبير حروف الحكم بالخط العثماني (Amiri Quran كبديل فوري لـ KFGQPC)</p>
    </div>
    <span class="text-xs bg-emerald-500/15 text-emerald-300 px-3 py-1 rounded-full font-bold">عرض عملي — افتح هذا الملف مباشرة</span>
  </header>

  <div class="grid gap-4 lg:grid-cols-[280px_1fr]">
    <aside class="rounded-2xl border border-white/10 bg-white/5 p-4">
      <label class="text-xs font-bold text-slate-400">مستدعي الأمثلة الفوري</label>
      <input id="q" oninput="render()" placeholder="ابحث: إظهار / خ / قلقلة / البقرة…" class="mt-2 w-full rounded-xl border border-white/10 bg-black/30 px-3 py-2.5 text-sm outline-none focus:border-emerald-500">
      <div class="mt-3 grid grid-cols-2 gap-2" id="ruleBtns"></div>
      <div class="mt-3 space-y-2" id="list"></div>
    </aside>

    <main class="rounded-2xl border border-white/10 bg-white/5 p-5 md:p-8">
      <div class="flex justify-between items-center flex-wrap gap-2">
        <span id="badge" class="rounded-full bg-emerald-500/15 px-3 py-1 text-sm font-bold text-emerald-300"></span>
        <label class="text-sm flex items-center gap-2"><input type="checkbox" id="iso" checked onchange="renderBoard()" class="accent-emerald-500 w-4 h-4"> فصل حروف الحكم</label>
      </div>
      <div id="board" class="font-quran mt-6 rounded-2xl bg-black/30 p-6 text-center text-4xl md:text-5xl leading-[2.2]"></div>
      <p id="hint" class="mt-3 text-center text-sm text-slate-400"></p>
      <div id="isoBox" class="mt-6"></div>
      <div id="exp" class="mt-6 rounded-2xl border border-emerald-500/30 bg-emerald-500/5 p-4 text-sm leading-7 fade-in"></div>
    </main>
  </div>
  <p class="mt-4 text-center text-[11px] text-slate-500">قاعدة هندسية: التظليل على مستوى الكلمة يحافظ على اتصال الحروف العربية — لا تُفكك الكلمة إلى حروف &lt;span&gt; داخل المصحف.</p>
</div>

<script>
const RULES = {
  izhar: { title:'الإظهار الحلقي', cls:'noon', tcls:'trigger', hint:'النون واضحة + حرف حلقي — لاحظ التباعد بين المخرجين' },
  ikhfa: { title:'الإخفاء الحقيقي', cls:'noon', tcls:'ikhf', hint:'حالة بين الإظهار والإدغام مع غنة حركتين' },
  qalqalah: { title:'القلقلة', cls:'', tcls:'qalq', hint:'اهتزاز حرف قطب جد الساكن' },
};
const EX = [
  { id:'ex1', rule:'izhar', ref:'البقرة 74 — ﴿مِنْ خَشْيَةِ﴾', trig:'خ', words:[{t:'مِنْ',k:'noon',n:'نون ساكنة'},{t:'خَشْيَةِ',k:'trigger',n:'حرف الإظهار: خ'},{t:'ٱللَّهِ',k:''}], exp:'نون ساكنة + خ (من حروف الحلق ء هـ ع ح غ خ) ← إظهار حلقي: تُنطق النون واضحة من مخرجها لتباعد المخرجين.' },
  { id:'ex2', rule:'izhar', ref:'النساء 57 — تنوين + ح', trig:'ح', words:[{t:'عَلِيمًا',k:''},{t:'حَكِيمًا',k:'trigger',n:'حرف الإظهار: ح'}], exp:'تنوين (نون ساكنة لفظاً) + ح ← إظهار حلقي.' },
  { id:'ex3', rule:'ikhfa', ref:'البقرة 3 — ﴿مِن فَضْلِ﴾', trig:'ف', words:[{t:'مِن',k:'noon',n:'نون ساكنة'},{t:'فَضْلِ',k:'trigger',n:'حرف الإخفاء: ف'},{t:'ٱللَّهِ',k:''}], exp:'نون ساكنة + ف ← إخفاء حقيقي بغنة مرققة حركتين.' },
  { id:'ex4', rule:'qalqalah', ref:'الإخلاص 1 — ﴿قُلْ﴾', trig:'ق', words:[{t:'قُلْ',k:'trigger',n:'قاف مقلقلة'},{t:'هُوَ',k:''},{t:'ٱللَّهُ',k:''},{t:'أَحَدٌ',k:''}], exp:'القاف من (قطب جد) ساكنة ← قلقلة صغرى: اهتزاز المخرج دون ميل لحركة.' },
];
let activeRule='izhar', activeId='ex1';
function renderBtns(){
  document.getElementById('ruleBtns').innerHTML = Object.entries(RULES).map(([k,v])=>
    `<button onclick="activeRule='${k}';activeId=EX.find(e=>e.rule==='${k}').id;render()" class="rounded-xl px-2 py-2 text-sm font-bold ${activeRule===k?'bg-emerald-500 text-white':'bg-white/5 hover:bg-white/10'}">${v.title}</button>`).join('');
}
function render(){
  renderBtns();
  const q = document.getElementById('q').value.trim();
  const res = EX.filter(e => (!q || e.ref.includes(q)||e.trig.includes(q)||e.exp.includes(q)||RULES[e.rule].title.includes(q)) && (q?true:e.rule===activeRule));
  document.getElementById('list').innerHTML = res.map(e=>
    `<button onclick="activeId='${e.id}';activeRule='${e.rule}';render()" class="w-full rounded-xl border p-3 text-right fade-in ${e.id===activeId?'border-emerald-500 bg-emerald-500/10':'border-white/10 hover:border-emerald-500/50'}">
      <div class="font-quran text-xl leading-loose">${e.words.map(w=>w.t).join(' ')}</div>
      <div class="text-xs text-slate-400 mt-1">${e.ref} • حرف ${e.trig}</div>
    </button>`).join('') || '<p class="text-sm text-slate-500">لا نتائج — جرّب: خ / قلقلة</p>';
  renderBoard();
}
function renderBoard(){
  const e = EX.find(x=>x.id===activeId), R = RULES[e.rule], iso = document.getElementById('iso').checked;
  document.getElementById('badge').textContent = R.title+' — '+e.ref;
  document.getElementById('hint').textContent = R.hint;
  document.getElementById('board').innerHTML = e.words.map(w=>{
    const c = w.k==='noon'?R.cls : w.k==='trigger'?R.tcls : '';
    return `<span title="${w.n||''}" class="word inline-block mx-2 px-3 rounded-xl ${iso?c:''}">${w.t}</span>`;
  }).join('');
  const noon = e.words.find(w=>w.k==='noon'), trig = e.words.find(w=>w.k==='trigger');
  document.getElementById('isoBox').innerHTML = (iso && noon && trig) ? `
    <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-3 fade-in">
      <div class="rounded-2xl p-5 text-center bg-emerald-500/10 outline outline-2 outline-emerald-400/60"><div class="font-quran text-5xl">${noon.t}</div><div class="text-xs font-bold mt-2">نون ساكنة — طرف اللسان</div></div>
      <div class="text-center"><div class="text-2xl arrow">↔</div><div class="text-[11px] font-bold text-slate-400">تباعد<br>= إظهار</div></div>
      <div class="rounded-2xl p-5 text-center bg-amber-500/10 outline outline-2 outline-amber-400/60"><div class="font-quran text-5xl">${trig.t}</div><div class="text-xs font-bold mt-2">حرف الحلق (${e.trig})</div></div>
    </div>` : (iso && trig ? `<div class="rounded-2xl p-5 text-center bg-rose-500/10 outline outline-2 outline-rose-400/60 fade-in"><div class="font-quran text-5xl">${trig.t}</div><div class="text-xs font-bold mt-2">الحرف المقلقَل (${e.trig}) — اسمع الارتداد</div></div>` : '');
  document.getElementById('exp').innerHTML = '<b class="text-emerald-300">التعليل: </b>'+e.exp;
}
render();
</script>
</body>
</html>
