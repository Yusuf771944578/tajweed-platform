<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي السرعة (Time Attack) - منصة تعلم التجويد</title>
<link rel="stylesheet" href="assets/app.css?v=15">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'IBM Plex Sans Arabic',sans-serif}
  .fq{font-family:'Amiri Quran',serif}
  .fade{animation:fd .25s ease both}
  @keyframes fd{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
</head>
<body class="bg-[#0B1020] text-slate-100 min-h-screen p-4 md:p-8">
<div class="max-w-3xl mx-auto" id="app"></div>

<script src="assets/xp.js?v=6"></script>
<script src="assets/site.js?v=16"></script>
<script src="assets/cloud.js?v=2"></script>
<script>
const ALL_QS = [
  // 1. الاستعاذة والبسملة
  {cat: 'استعاذة وبسملة', p: 'ما حكم الاستعاذة عند قراءة القرآن الكريم؟', r: 'مستحبة وقيل وجيبة', w: [['واجبة قطعا', 0],['مستحبة باتفاق الجمهور', 1],['مكروهة', 0]]},
  {cat: 'استعاذة وبسملة', p: 'ما هو حكم البسملة في أول سورة التوبة (براءة)؟', r: 'لا تبسمل فيها', w: [['سنة مؤكدة', 0],['ممنوعة (لا تُقْرَأ)', 1],['مستحبة', 0]]},
  {cat: 'استعاذة وبسملة', p: 'هل تجوز الاستعاذة في أوسط السورة؟', r: 'نعم يجوز', w: [['نعم يجوز', 1],['لا يجوز مطلقا', 0]]},
  
  // 2. النون والميم الساكنتان
  {cat: 'نون وميم ساكنتان', p: 'ما حكم النون الساكنة في قوله تعالى: (مِنْ رَبِّهِمْ)', r: 'إدغام بغنة', w: [['إظهار', 0],['إدغام بغنة', 1],['اقلاب', 0]]},
  {cat: 'نون وميم ساكنتان', p: 'ما حكم الميم الساكنة إذا جاء بعدها حرف الباء (إخفاء شفوي):', r: 'ترمي بحجارة', w: [['تَرْمِيهِمْ بِحِجَارَةٍ', 1],['لَهُمْ مَغْفِرَةٌ', 0],['أَمْ لَمْ تُنذِرْهُمْ', 0]]},
  {cat: 'نون وميم ساكنتان', p: 'ما حكم النون الساكنة في قوله تعالى: (مَنْ آمَنَ)', r: 'إظهار حلقي', w: [['إظهار حلقي', 1],['إدغام بغنة', 0],['إخفاء', 0]]},
  {cat: 'نون وميم ساكنتان', p: 'ما حكم النون الساكنة في قوله تعالى: (مِنْ بَعْدِ)', r: 'إقلاب', w: [['إظهار', 0],['إقلاب', 1],['إدغام', 0]]},
  {cat: 'نون وميم ساكنتان', p: 'ما حكم الميم الساكنة في قوله تعالى: (لَهُمْ مَغْفِرَةٌ)', r: 'إظهار شفوي', w: [['إظهار شفوي', 1],['إخفاء شفوي', 0],['إدغام', 0]]},
  {cat: 'نون وميم ساكنتان', p: 'ما حكم النون الساكنة مع حرف الراء في (أن رءاه)', r: 'إدغام بغير غنة', w: [['إدغام بغير غنة', 1],['إظهار', 0]]},
  {cat: 'نون وميم ساكنتان', p: 'كم عدد حروف الإظهار الحلقي؟', r: '6 حروف', w: [['4 حروف', 0],['6 حروف', 1],['15 حرفا', 0]]},

  // 3. المدود
  {cat: 'المدود', p: 'اختر كلمة بها مد لازم كلمي مثقل:', r: 'حاقة', w: [['حَاقَّة', 1],['جَاءَ', 0],['فِي', 0]]},
  {cat: 'المدود', p: 'ما مقدار مد العارض للسكون جائز؟', r: '2 أو 4 أو 6 حركات', w: [['حركتان فقط', 0],['2 أو 4 أو 6 حركات', 1],['6 حركات لازمة', 0]]},
  {cat: 'المدود', p: 'ما حكم المد المتصل عند حفص؟', r: 'واجب المد 4 أو 5 حركات', w: [['جائز القصر', 0],['واجب المد 4 أو 5 حركات', 1],['لازم 6 حركات', 0]]},
  {cat: 'المدود', p: 'ما هو المد المنفصل؟', r: 'حرف المد في كلمة وهمزة في أخرى', w: [['حرف المد والهمزة في كلمة واحدة', 0],['حرف المد في كلمة والهمزة في بداية الكلمة التي تليها', 1]]},
  {cat: 'المدود', p: 'ما مقدار مد الصلة الصغرى؟', r: 'حركتان', w: [['حركتان', 1],['4 حركات', 0],['6 حركات', 0]]},

  // 4. التفخيم والترقيق
  {cat: 'تفخيم وترقيق', p: 'ما حكم حرف الراء في كلمة (فِرْقٍ)؟', r: 'مرقق', w: [['مرقق', 1],['مفخم', 0]]},
  {cat: 'تفخيم وترقيق', p: 'حروف الاستعلاء دائماً:', r: 'مفخمة', w: [['مفخمة', 1],['مرققة', 0]]},
  {cat: 'تفخيم وترقيق', p: 'حرف الراء المضمومة يكون:', r: 'مفخما', w: [['مفخما', 1],['مرققا', 0]]},

  // 5. الوقف والابتداء
  {cat: 'الوقف والابتداء', p: 'ما حكم الوقف على رأس الآيات القرآنية؟', r: 'سنة', w: [['سنة مستحبة', 1],['مكروه', 0],['محرم', 0]]},
  {cat: 'الوقف والابتداء', p: 'الوقف التام يكون على:', r: 'ما تم معناه ولم يتعلق بما بعده', w: [['ما تم معناه ولم يتعلق بما بعده لفظا ولا معنى', 1],['ما تعلق بما بعده', 0]]}
];

let T = 12, ph = 'lobby', qi = 0, tl = T, xp = 0, combo = 0, mx = 0, ok = 0, fl = null, timer = null, last = 0;
let selectedCats = ['استعاذة وبسملة', 'نون وميم ساكنتان', 'المدود', 'تفخيم وترقيق', 'الوقف والابتداء'], activeQS = [];

function getCats() {
  var cats = [];
  for (var i = 0; i < ALL_QS.length; i++) {
    if (cats.indexOf(ALL_QS[i].cat) === -1) cats.push(ALL_QS[i].cat);
  }
  return cats;
}

function render() {
  const el = document.getElementById('app');
  let head = `<div class="mb-6 flex justify-between items-center">
    <span class="text-xs font-bold text-slate-400">⚡ وضع تحدي السرعة في التجويد</span>
    <span class="flex gap-2"><a href="demo-skill-tree.html" class="rounded-xl border border-emerald-500/40 bg-emerald-500/10 px-4 py-2 text-xs font-bold text-emerald-300 hover:bg-emerald-500/20">🌳 الشجرة</a><a href="index.html" class="rounded-xl border border-white/10 bg-white/5 px-4 py-2 text-xs font-bold hover:bg-white/10">العودة للرئيسية</a></span>
  </div>`;

  if (ph === 'play') {
    head += `<div class="flex gap-2 text-xs font-bold mb-4 justify-end">
      <span class="rounded-full bg-amber-400/10 border border-amber-400/30 px-3 py-1 text-amber-300">⭐ ${xp} XP</span>
      ${combo >= 2 ? `<span class="rounded-full bg-violet-500/15 border border-violet-500/40 px-3 py-1 text-violet-300">🔥 تتابع x${combo}</span>` : ''}
      <span class="rounded-full bg-white/5 px-3 py-1">${qi + 1} / ${activeQS.length}</span>
    </div>`;
  }

  let body = '';
  if (ph === 'lobby') {
    var cats = getCats();
    var allSelected = selectedCats.length === cats.length;

    body = `<div class="fade rounded-2xl border border-white/10 bg-white/[.04] p-8 text-center">
      <div class="text-5xl mb-3">⚡</div>
      <h1 class="text-3xl font-extrabold mt-2">تحدي <span class="text-amber-300">السرعة الخاطف</span></h1>
      <p class="text-sm text-slate-400 mt-2">أجب على الأسئلة بأسرع وقت ممكن لكسب نقاط مضاعفة ورفع رتبتك!</p>
      
      <div class="my-6">
        <div class="flex justify-between items-center mb-2 px-2">
          <p class="text-xs font-bold text-slate-400">اختر الأقسام المطلوبة (متعدد):</p>
          <button onclick="toggleAllCats()" class="text-xs font-bold text-emerald-400 hover:underline">${allSelected ? 'إلغاء تحديد الكل' : 'تحديد الكل'}</button>
        </div>
        <div class="flex flex-wrap justify-center gap-2">
          ${cats.map(c => {
            var active = selectedCats.indexOf(c) !== -1;
            return `<button onclick="toggleCat('${c}')" class="rounded-xl px-3 py-1.5 text-xs font-bold ${active ? 'bg-amber-400 text-black shadow-lg' : 'bg-white/5 border border-white/10 text-slate-400'}">${c}</button>`;
          }).join('')}
        </div>
      </div>

      <div class="mt-6 flex justify-center items-center gap-3 text-xs font-bold">
        <span class="text-slate-400">وقت السؤال:</span>
        ${[8, 12, 15].map(s => `<button onclick="setT(${s})" class="rounded-xl px-4 py-2 ${T === s ? 'bg-amber-400 text-black' : 'bg-white/5 border border-white/10'}">${s} ثانية</button>`).join('')}
      </div>

      <button onclick="start()" class="mt-8 rounded-xl bg-amber-400 px-10 py-3.5 text-sm font-extrabold text-black hover:bg-amber-300">ابدأ التحدي الآن</button>
    </div>`;
  } else if (ph === 'play') {
    const q = activeQS[qi];
    body = `<div class="h-2 rounded-full bg-white/10 overflow-hidden mb-6">
      <div class="h-full rounded-full ${tl < 4 ? 'bg-rose-500' : 'bg-gradient-to-l from-amber-300 to-emerald-400'}" style="width:${tl / T * 100}%"></div>
    </div>
    <div class="fade rounded-2xl border p-6 text-center ${fl === 'g' ? 'border-emerald-400 bg-emerald-500/10' : fl === 'b' ? 'border-rose-500 bg-rose-500/10' : 'border-white/10 bg-white/[.04]'}">
      <div class="text-xs text-amber-300 font-bold mb-1">السؤال ${qi + 1} من ${activeQS.length} (${q.cat})</div>
      <p class="text-base font-bold mb-2">${q.p}</p>
      <p class="text-xs text-slate-400 font-bold mb-6">الوقت المتبقي: ${tl.toFixed(1)} ثانية</p>
      
      <div class="grid gap-3 max-w-md mx-auto">
        ${q.w.map(x => `<button onclick="pick(${x[1]})" class="w-full p-3 rounded-xl bg-black/40 border border-white/10 hover:border-amber-400/60 font-bold text-sm transition">${x[0]}</button>`).join('')}
      </div>
      
      ${fl === 'g' ? `<p class="text-emerald-300 font-extrabold mt-4">+${last} XP ممتاز!</p>` : ''}
      ${fl === 'b' ? `<p class="text-rose-300 font-bold mt-4">❌ خطأ أو انتهى الوقت!</p>` : ''}
    </div>`;
  } else if (ph === 'res') {
    const a = ok / activeQS.length;
    body = `<div class="fade rounded-2xl border border-white/10 bg-white/[.04] p-8 text-center">
      <div class="text-5xl mb-3">${a >= .8 ? '🏆' : a >= .5 ? '⭐' : '💪'}</div>
      <h2 class="text-2xl font-extrabold mt-2">${a >= .8 ? 'أداء ممتاز ورائع!' : a >= .5 ? 'جيد جداً، استمر!' : 'حاول مرة أخرى لتحسين مستواك'}</h2>
      
      <div class="mx-auto mt-6 grid max-w-md grid-cols-3 gap-3">
        <div class="rounded-xl bg-amber-400/10 border border-amber-400/30 p-3">
          <div class="text-xl font-extrabold text-amber-300">+${xp}</div>
          <div class="text-[11px] text-slate-400">النقاط المكتسبة</div>
        </div>
        <div class="rounded-xl bg-black/30 border border-white/10 p-3">
          <div class="text-xl font-extrabold text-white">${ok}/${activeQS.length}</div>
          <div class="text-[11px] text-slate-400">الإجابات الصحيحة</div>
        </div>
        <div class="rounded-xl bg-black/30 border border-white/10 p-3">
          <div class="text-xl font-extrabold text-violet-300">x${mx}</div>
          <div class="text-[11px] text-slate-400">أقصى تتابع</div>
        </div>
      </div>

      <div class="mx-auto mt-6 flex max-w-md gap-3">
        <button onclick="restart()" class="flex-1 rounded-xl bg-amber-400 py-3 text-sm font-extrabold text-black hover:bg-amber-300">إعادة التحدي</button>
        <a href="index.html" class="flex-1 rounded-xl border border-white/10 bg-white/5 py-3 text-sm font-bold hover:bg-white/10">الرئيسية</a>
      </div>
    </div>`;
  }
  el.innerHTML = head + body;
}

function toggleCat(c) {
  var idx = selectedCats.indexOf(c);
  if (idx !== -1) {
    if (selectedCats.length > 1) selectedCats.splice(idx, 1);
  } else {
    selectedCats.push(c);
  }
  render();
}

function toggleAllCats() {
  var cats = getCats();
  if (selectedCats.length === cats.length) {
    selectedCats = [cats[0]];
  } else {
    selectedCats = [...cats];
  }
  render();
}

function setT(v) { T = v; render(); }

function start() {
  activeQS = ALL_QS.filter(q => selectedCats.indexOf(q.cat) !== -1);
  if (activeQS.length === 0) {
    alert('يرجى اختيار قسم واحد على الأقل!');
    return;
  }
  activeQS.sort(() => Math.random() - 0.5);
  ph = 'play'; qi = 0; xp = 0; combo = 0; mx = 0; ok = 0; tick();
}

function restart() { ph = 'lobby'; render(); }

function tick() {
  fl = null; tl = T; render();
  clearInterval(timer);
  timer = setInterval(() => {
    tl = Math.round((tl - 0.1) * 10) / 10;
    if (tl <= 0) {
      clearInterval(timer);
      miss();
    } else {
      const b = document.querySelector('#app .h-2>div');
      if (b) {
        b.style.width = (tl / T * 100) + '%';
        b.className = 'h-full rounded-full ' + (tl < 4 ? 'bg-rose-500' : 'bg-gradient-to-l from-amber-300 to-emerald-400');
      }
    }
  }, 100);
}

function miss() {
  combo = 0; fl = 'b'; render();
  setTimeout(() => {
    if (qi + 1 >= activeQS.length) end();
    else { qi++; tick(); }
  }, 700);
}

function pick(o) {
  clearInterval(timer);
  if (o) {
    const g = Math.round((20 + (tl / T) * 30) * (1 + Math.min(combo, 4) * 0.25));
    xp += g; ok++; combo++; mx = Math.max(mx, combo); last = g; fl = 'g';
  } else {
    combo = 0; fl = 'b';
  }
  render();
  setTimeout(() => {
    if (qi + 1 >= activeQS.length) end();
    else { qi++; tick(); }
  }, 700);
}

function end() {
  try { XP.add(xp); } catch(e) {}
  ph = 'res';
  render();
}

render();
</script>
</body>
</html>
