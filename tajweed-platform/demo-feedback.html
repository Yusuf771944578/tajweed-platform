<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استمارة التجربة الميدانية — رأيك يبني المنصة</title>
<link rel="stylesheet" href="assets/app.css?v=11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif}.fade{animation:fd .3s ease both}@keyframes fd{from{opacity:0}to{opacity:1}}.star{font-size:30px;cursor:pointer;filter:grayscale(1);opacity:.5;transition:all .15s}.star.on{filter:none;opacity:1;transform:scale(1.15)}</style>
</head>
<body class="bg-[#0B1020] text-slate-100 min-h-screen">
<div class="max-w-2xl mx-auto p-4 md:p-8">
<header class="text-center">
<h1 class="text-2xl font-extrabold">📝 استمارة التجربة <span class="text-emerald-400">الميدانية</span></h1>
<p class="text-xs text-slate-400 mt-1">جرّبت المنصة؟ أخبرنا برأيك الصادق — إجابتك تصل للمعلم مباشرة (+20 XP شكراً لك).</p>
</div>
<div id="form" class="mt-5 rounded-2xl border border-white/10 bg-white/[.04] p-5 space-y-3">
<div>
<label class="text-xs font-bold text-slate-400">الاسم (اختياري)</label>
<input id="fName" placeholder="مثال: أحمد" class="mt-1 w-full rounded-xl border border-white/10 bg-black/30 px-3 py-2.5 text-sm outline-none">
</div>
<div class="grid grid-cols-2 gap-2">
<div>
<label class="text-xs font-bold text-slate-400">المرحلة الدراسية</label>
<select id="fStage" class="mt-1 w-full rounded-xl border border-white/10 bg-black/30 px-3 py-2.5 text-sm outline-none">
<option>إعدادية</option><option>ثانوية</option><option>جامعية</option><option>معلم / مشرف</option>
</select>
</div>
<div>
<label class="text-xs font-bold text-slate-400">الصفحة المُختبرة</label>
<select id="fPage" class="mt-1 w-full rounded-xl border border-white/10 bg-black/30 px-3 py-2.5 text-sm outline-none">
<option>الشجرة</option><option>الاستوديو</option><option>الدرس</option><option>المصحف</option><option>المتون</option><option>السرعة</option><option>النزال</option><option>الصدارة</option><option>الاختبار</option><option>الرئيسية</option>
</select>
</div>
</div>
<div>
<label class="text-xs font-bold text-slate-400">تقييمك العام</label>
<div id="stars" class="mt-1 flex gap-1 justify-center" dir="ltr"></div>
</div>
<div>
<label class="text-xs font-bold text-slate-400">ما الذي أعجبك؟</label>
<textarea id="fLikes" rows="2" placeholder="اكتب بحرية…" class="mt-1 w-full rounded-xl border border-white/10 bg-black/30 px-3 py-2.5 text-sm outline-none"></textarea>
</div>
<div>
<label class="text-xs font-bold text-slate-400">ما المشاكل التي واجهتك؟ (مهم جداً)</label>
<textarea id="fIssues" rows="2" placeholder="مثال: زر لا يعمل، نص غير واضح، صوت لا يخرج…" class="mt-1 w-full rounded-xl border border-white/10 bg-black/30 px-3 py-2.5 text-sm outline-none"></textarea>
</div>
<div>
<label class="text-xs font-bold text-slate-400">اقتراحاتك</label>
<textarea id="fIdeas" rows="2" placeholder="ماذا تتمنى أن نضيف؟" class="mt-1 w-full rounded-xl border border-white/10 bg-black/30 px-3 py-2.5 text-sm outline-none"></textarea>
</div>
<p id="fErr" class="text-xs font-bold text-rose-300"></p>
<button onclick="sendFB()" id="fBtn" class="w-full rounded-xl bg-emerald-500 py-3 text-sm font-extrabold text-white">إرسال الاستمارة ✓</button>
</div>
<div id="doneBox" style="display:none" class="mt-5 rounded-2xl border border-emerald-500/40 bg-emerald-500/10 p-8 text-center fade">
<div class="text-5xl">🙏</div>
<h2 class="text-xl font-extrabold mt-2">وصلتنا إجابتك — شكراً لك!</h2>
<p class="text-sm text-slate-400 mt-1">+20 XP أُضيفت لرصيدك • يمكنك تعبئة استمارة أخرى لصفحة مختلفة</p>
<button onclick="location.reload()" class="mt-4 rounded-xl bg-white/10 px-8 py-2.5 text-sm font-bold">استمارة جديدة</button>
</div>
</div>
<script src="assets/xp.js?v=7"></script>
<script src="assets/site.js?v=17"></script>
<script src="assets/cloud.js?v=3"></script>
<script>
var SB_URL='https://uiduazvdpkrizwrqegka.supabase.co';
var SB_KEY='sb_publishable_6fLZj6z11HmnTg9GBRzd8g_V8HYYfis';
var RATING=0;
(function(){
  var box=document.getElementById('stars'),h='';
  for(var i=1;i<=5;i++)h+='<span class="star" data-v="'+i+'" onclick="setR('+i+')">⭐</span>';
  box.innerHTML=h;
})();
function setR(v){
  RATING=v;
  var els=document.querySelectorAll('#stars .star');
  for(var i=0;i<els.length;i++)els[i].classList.toggle('on',i<v);
}
function dev(){
  try{
    var d=localStorage.getItem('tajweed_device');
    if(!d){d='d-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);localStorage.setItem('tajweed_device',d)}
    return d;
  }catch(e){return 'd-anon'}
}
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
function sendFB(){
  var btn=document.getElementById('fBtn'),err=document.getElementById('fErr');
  err.textContent='';
  if(!RATING){err.textContent='اختر تقييم النجوم أولاً ⭐';return}
  var row={device_id:dev(),name:val('fName'),stage:val('fStage'),page:val('fPage'),rating:RATING,likes:val('fLikes'),issues:val('fIssues'),ideas:val('fIdeas')};
  btn.disabled=true;btn.textContent='⏳ جارٍ الإرسال…';
  function done(ok,offline){
    document.getElementById('form').style.display='none';
    document.getElementById('doneBox').style.display='block';
    try{XP.add(20)}catch(e){}
    if(window.CLOUD&&window.CLOUD.enabled()){try{window.CLOUD.flush()}catch(e){}}
    if(offline)err.textContent='';
  }
  fetch(SB_URL+'/rest/v1/pilot_feedback',{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify(row)
  }).then(function(r){
    if(!r.ok)throw 0;
    done(true,false);
  }).catch(function(){
    try{
      var q=JSON.parse(localStorage.getItem('tajweed_fb_queue')||'[]');
      q.push(row);localStorage.setItem('tajweed_fb_queue',JSON.stringify(q.slice(-20)));
    }catch(e){}
    btn.disabled=false;btn.textContent='إرسال الاستمارة ✓';
    err.textContent='لا إنترنت — حُفظت إجابتك في جهازك وستُرسل تلقائياً عند الاتصال (أعد المحاولة لاحقاً)';
  });
}
</script>
</body>
</html>
