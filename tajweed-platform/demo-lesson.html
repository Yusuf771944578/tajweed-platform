      var _rn2=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة'][Math.max(1,Math.min(10,_pl.rank))-1];
      var _ln=(LESSONS[_pl.node]||{}).t||'';
      h+='<div class="mt-3 rounded-2xl border border-violet-500/40 bg-violet-500/10 p-4 text-sm text-center leading-7">📊 مستواك من الاختبار: <b class="text-amber-300">المرتبة '+_rn2+'</b> ('+_pl.pct+'%)'
      +(_ln?' — نوصي بدرس: <b class="text-emerald-300">'+_ln+'</b> <a href="demo-lesson.html?l='+_pl.node+'" class="font-extrabold text-emerald-300">ابدأه ←</a>':'')
      +' <a href="demo-quiz.html" class="text-xs font-bold text-slate-400">↻ أعد الاختبار</a></div>';
    }
  }catch(e){}
  GROUPS.forEach(function(g,gi){
    h+='<h2 class="mt-6 font-extrabold">'+g.t+'</h2><div class="mt-3 grid gap-3 sm:grid-cols-2">';
    ORDER.forEach(function(id,idx){
      if(id[0]!==g.id)return;
      var ls=LESSONS[id],n=nodes[id]||{m:0,best:0},pc=n.best?Math.round(n.best*100):0;
      h+='<a href="demo-lesson.html?l='+id+'" class="lcard block rounded-2xl border p-5 '+(n.m>0?'border-emerald-500/50 bg-emerald-500/5':'border-white/10 bg-white/[.03]')+'">'
      +'<div class="flex justify-between items-start gap-2"><span class="rounded-lg bg-white/5 border border-white/10 px-2.5 py-1 text-xs font-extrabold text-slate-300">'+(idx+1)+'</span>'
      +(n.m>0?'<span class="text-xs font-extrabold text-emerald-300">🌟 مكتمل</span>':pc>0?'<span class="text-xs font-bold text-amber-300">'+pc+'%</span>':'<span class="text-xs text-slate-500">لم يبدأ</span>')+'</div>'
      +'<div class="mt-2 font-extrabold">'+ls.t+'</div><p class="text-xs text-slate-400 mt-1 leading-6">'+ls.d+'</p>'
      +'<div class="mt-3 h-1.5 rounded-full bg-white/10 overflow-hidden"><div class="h-full rounded-full bg-gradient-to-l from-emerald-400 to-sky-400" style="width:'+pc+'%"></div></div>'
      +'<div class="mt-3 flex justify-between items-center text-xs font-bold"><span class="text-amber-300">⭐ +'+ls.xp+' XP</span><span class="text-emerald-300">ابدأ الدرس ←</span></div></a>';
    });
    h+='</div>';
  });
  h+='<footer class="mt-8 text-center text-[11px] text-slate-500">📜 أبيات الدروس من تحفة الأطفال ومتن الجزرية — ترقب واجهة المتون قريباً</footer>';
  el.innerHTML=h;
}
/* ---- العرض الرئيسي ---- */
function render(){
  applyFS();
  var el=document.getElementById('app');
  if(!L){renderIndex();return}
  var head=headHTML();
  var body='';
  if(step===0)body='<div class="fade rounded-2xl border border-white/10 bg-white/[.04] p-5 md:p-8">'
    +'<p class="text-xs text-slate-400 mt-1">'+(ADV()?'🎓 مسار المتقدمين: كل المعلومات النظرية والتطبيقية':'🌱 مسار المبتدئين: أهم المعلومات التطبيقية فقط')+'</p>'
    +secObj()+secTerms()+secIntro()+pickerHTML()
    +'<button onclick="step=1;render()" class="mt-5 w-full rounded-xl bg-emerald-500 py-3 text-sm font-extrabold hover:bg-emerald-400">التالي: شاهد واستكشف ←</button></div>';
  if(step===1)body='<div class="fade rounded-2xl border border-white/10 bg-white/[.04] p-5 md:p-8">'+secObserve()+navBtns(0,2,'التالي: افهم القاعدة ←')+'</div>';
  if(step===2)body='<div class="fade rounded-2xl border border-white/10 bg-white/[.04] p-5 md:p-8">'+secConcept()+secRule()+secWorked()+navBtns(1,3,'التالي: طبّق ولخّص ←')+'</div>';
  if(step===3)body='<div class="fade rounded-2xl border border-white/10 bg-white/[.04] p-5 md:p-8">'+secApps()+secSummary()+navBtns(2,4,'التالي: مختبر الصوت ←')+'</div>';
  if(step===4)body=secVoice();
  if(step===5)body='<div class="fade rounded-2xl border border-white/10 bg-white/[.04] p-5 md:p-8">'+secQuestions()+secBank()+navBtns(4,6,'التالي: الاختبار النهائي ←')+'</div>';
  if(step===6)body='<div class="fade rounded-2xl border border-white/10 bg-white/[.04] p-5 md:p-8">'+secFinal()+'</div>';
  if(step===7)body='<div class="fade rounded-2xl border border-white/10 bg-white/[.04] p-8 text-center">'
    +'<div class="text-5xl">'+(done.completed?'🌟':'💪')+'</div>'
    +'<h2 class="mt-2 text-2xl font-extrabold">'+(done.completed?'بارك الله فيك، لقد أتممت الدرس بنجاح!':'حاول مرة أخرى لتحقيق إتقان أفضل')+'</h2>'
    +'<p class="text-sm text-amber-300 font-bold mt-2">'+(done.completed?'«خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ»':'«المَاهِرُ بِالْقُرْآنِ مَعَ السَّفَرَةِ الْكِرَامِ الْبَرَرَةِ»')+'</p>'
    +'<p class="text-xs text-slate-400 mt-2">درجتك في الاختبار: '+Math.round(done.fs*100)+'% • الصوت: '+Math.round(done.vs*100)+'%</p>'
    +'<div class="mx-auto mt-4 grid max-w-md grid-cols-2 gap-2">'
    +'<div class="rounded-xl bg-amber-400/10 border border-amber-400/30 p-4"><div class="text-2xl font-extrabold text-amber-300">+'+done.xp+' XP</div><div class="text-xs text-slate-400">إجمالي النقاط</div></div>'
    +'<div class="rounded-xl bg-orange-500/10 border border-orange-500/30 p-4"><div class="text-2xl font-extrabold text-orange-300">🔥 '+done.streak+'</div><div class="text-xs text-slate-400">الأيام المتتالية</div></div></div>'
    +'<div class="mx-auto mt-4 flex max-w-md gap-2 flex-wrap"><a href="demo-lesson.html" class="flex-1 rounded-xl bg-white/5 border border-white/10 py-3 text-sm font-bold text-center">كل الدروس</a><a href="demo-skill-tree.html?v=13" class="flex-1 rounded-xl bg-emerald-500 py-3 text-sm font-extrabold text-center text-black hover:bg-emerald-400">شجرة المهارات</a>'
    +'<button onclick="resetAll()" class="flex-1 rounded-xl bg-white/5 py-3 text-sm font-bold">إعادة الدرس</button></div></div>';
  el.innerHTML=head+body;
}
function resetAll(){step=0;rec='idle';sec=0;voice=null;done=null;micBlocked=false;bankTf={};bankMcq={};matchSel=[-1,-1,-1,-1];matchOk=false;matchScore=0;finalAns=[-1,-1,-1,-1,-1];shown={};PLAYKEY=null;try{var a=document.getElementById('recAudio');if(a)a.pause()}catch(e){}try{clearInterval(timer)}catch(e){}render()}
function finalScore(){var c=0;for(var i=0;i<L.final.length;i++)if(finalAns[i]===L.final[i].c)c++;return L.final.length?c/L.final.length:0}
async function startRec(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});
  var AC=new (window.AudioContext||window.webkitAudioContext)(),src=AC.createMediaStreamSource(stream),an=AC.createAnalyser();an.fftSize=2048;src.connect(an);
  window._ac=AC;rec='rec';sec=0;render();
  timer=setInterval(function(){sec++;var s=document.querySelector('#app span.font-bold');if(s)s.textContent=sec+' ث'},1000);
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),buf=new Uint8Array(an.fftSize);
  (function loop(){an.getByteTimeDomainData(buf);ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle='#34d399';ctx.lineWidth=2;ctx.beginPath();
  buf.forEach(function(v,i){var x=i/buf.length*cv.width,y=(v-128)/128*(cv.height/2-4)+cv.height/2;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
  if(rec==='rec')requestAnimationFrame(loop)})();
}catch(e){micBlocked=true;render()}}
function stopRec(){clearInterval(timer);try{stream.getTracks().forEach(function(t){t.stop()})}catch(e){}try{window._ac.close()}catch(e){}rec='an';render();
  setTimeout(function(){voice=Math.min(1,Math.round((.55+Math.min(1,sec/4)*.4+Math.random()*.08)*100)/100);rec='done';render()},1800)}
function demoMic(){micBlocked=false;rec='an';render();setTimeout(function(){voice=0.78;rec='done';render()},2000)}
function finish(){
  var fs=finalScore(),vs=(voice==null?fs:voice),sc=Math.round(((fs*.6)+(vs*.4))*100)/100,ok=sc>=.7,xp=ok?L.xp:Math.round(L.xp*.1*sc);
  try{XP.add(xp)}catch(e){}
  try{
    var P=JSON.parse(localStorage.getItem('tajweed_tree_v2'));
    if(P){var n=P.nodes[LID]||{m:0,att:0,best:0};n.att++;n.best=Math.max(n.best,sc);if(ok)n.m=Math.max(n.m,sc);P.nodes[LID]=n;localStorage.setItem('tajweed_tree_v2',JSON.stringify(P))}
  }catch(e){}
  var st=0;try{st=XP.streak()}catch(e){}
  done={xp:xp,completed:ok,streak:st,fs:fs,vs:vs};step=7;render();
}
try{var _ra=document.getElementById('recAudio');if(_ra)_ra.addEventListener('ended',function(){PLAYKEY=null;render()})}catch(e){}
render();
</script>
