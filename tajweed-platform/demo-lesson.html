function bar(){return ['الشرح والاستماع','مختبر الصوت','الاختبار','النتيجة'].map(function(s,i){return '<div class="flex-1"><div class="h-1.5 rounded-full '+(i<=step?'bg-emerald-400':'bg-white/10')+'"></div><div class="mt-1 text-[11px] font-bold '+(i===step?'text-emerald-300':'text-slate-500')+'">'+s+'</div></div>'}).join('')}

}
function quizScore(){if(!QUIZ.length)return 0;var c=0;for(var i=0;i<QUIZ.length;i++)if(answers[i]===QUIZ[i].c)c++;return c/QUIZ.length}
function estScore(){var qs=quizScore();return Math.round(((qs*.6)+((voice==null?qs:voice))*.4)*100)/100}
async function startRec(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});
  var AC=new (window.AudioContext||window.webkitAudioContext)(),src=AC.createMediaStreamSource(stream),an=AC.createAnalyser();an.fftSize=2048;src.connect(an);
  window._ac=AC;rec='rec';sec=0;render();
  timer=setInterval(function(){sec++;var s=document.querySelector('#app span.font-bold');if(s)s.textContent=sec+' ث'},1000);
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),buf=new Uint8Array(an.fftSize);
  (function loop(){an.getByteTimeDomainData(buf);ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle='#34d399';ctx.lineWidth=2;ctx.beginPath();
  buf.forEach(function(v,i){var x=i/buf.length*cv.width,y=(v-128)/128*(cv.height/2-4)+cv.height/2;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
  if(rec==='rec')requestAnimationFrame(loop)})();
}catch(e){micBlocked=true;render()}}
function stopRec(){clearInterval(timer);try{stream.getTracks().forEach(function(t){t.stop()})}catch(e){}try{window._ac.close()}catch(e){}rec='an';render();
  setTimeout(function(){voice=Math.min(1,Math.round((.55+Math.min(1,sec/4)*.4+Math.random()*.08)*100)/100);rec='done';render()},1800)}
function demoMic(){micBlocked=false;rec='an';render();setTimeout(function(){voice=0.78;rec='done';render()},2000)}
function finish(){
  var fs=estScore(),ok=fs>=.7,xp=ok?L.xp:Math.round(L.xp*.1*fs);
  try{XP.add(xp)}catch(e){}
  try{
    var P=JSON.parse(localStorage.getItem('tajweed_tree_v2'));
    if(P){var n=P.nodes[LID]||{m:0,att:0,best:0};n.att++;n.best=Math.max(n.best,fs);if(ok)n.m=Math.max(n.m,fs);P.nodes[LID]=n;localStorage.setItem('tajweed_tree_v2',JSON.stringify(P))}
  }catch(e){}
  var st=0;try{st=XP.streak()}catch(e){}
  done={xp:xp,completed:ok,streak:st};step=3;render();
}
render();
</script>
