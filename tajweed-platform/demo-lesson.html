<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة الدرس التفاعلية — الإظهار الحلقي</title>
<link rel="stylesheet" href="assets/app.css?v=10">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:'IBM Plex Sans Arabic',sans-serif}.fq{font-family:'Amiri Quran',serif}.fade{animation:fd .3s ease both}@keyframes fd{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
</head>
<body class="bg-[#0B1020] text-slate-100 min-h-screen">
<div class="max-w-4xl mx-auto p-4 md:p-8" id="app"></div>
<script src="assets/xp.js?v=5"></script>
<script src="assets/site.js?v=9"></script>
<script>
let step=0, answers=[-1,-1], rec='idle', sec=0, timer=null, voice=null, stream=null, done=null, micBlocked=false;
var LDEF={
izhar:{title:'الإظهار الحلقي',ref:'البقرة 74 — ﴿مِنْ خَشْيَةِ﴾',xp:80,words:[['مِنْ','noon'],['خَشْيَةِ','trigger'],['ٱللَّهِ','']],exp:'نون ساكنة + خ (من حروف الحلق ء هـ ع ح غ خ) ← إظهار حلقي لتباعد المخرجين.',quiz:[
{q:'ما حكم النون الساكنة في ﴿مِنْ خَشْيَةِ﴾؟',o:['إظهار حلقي','إدغام بغنة','إخفاء حقيقي'],c:0},
{q:'لماذا سُمّي إظهاراً حلقياً؟',o:['لتباعد مخرج النون عن حروف الحلق','لقرب المخرجين','لاختفاء الغنة'],c:0}]},
ikhfa:{title:'الإخفاء الحقيقي',ref:'البقرة 3 — ﴿مِن فَضْلِ﴾',xp:120,words:[['مِن','noon'],['فَضْلِ','trigger'],['ٱللَّهِ','']],exp:'نون ساكنة + ف ← إخفاء حقيقي بغنة مرققة بمقدار حركتين.',quiz:[
{q:'ما حكم النون في ﴿مِن فَضْلِ﴾؟',o:['إخفاء حقيقي','إظهار حلقي','إدغام بغنة'],c:0},
{q:'كم مقدار الغنة في الإخفاء؟',o:['حركتان','أربع حركات','بدون غنة'],c:0}]},
qalqalah:{title:'القلقلة',ref:'الإخلاص 1 — ﴿قُلْ﴾',xp:150,words:[['قُلْ','trigger'],['هُوَ',''],['ٱللَّهُ',''],['أَحَدٌ','']],exp:'القاف من حروف (قطب جد) ساكنة ← قلقلة صغرى: اهتزاز المخرج دون ميل لحركة.',quiz:[
{q:'ما حروف القلقلة؟',o:['قطب جد','يرملون','ء هـ ع ح غ خ'],c:0},
{q:'ما حكم القاف في ﴿قُلْ﴾؟',o:['قلقلة صغرى','قلقلة كبرى','إظهار حلقي'],c:0}]}
};
var _lk='izhar';try{_lk=new URLSearchParams(location.search).get('l')||'izhar'}catch(e){}
var L=LDEF[_lk]||LDEF.izhar;
var QUIZ=L.quiz;
function bar(){return ['الشرح','مختبر الصوت','التثبيت','النتيجة'].map((s,i)=>`<div class="flex-1"><div class="h-1.5 rounded-full ${i<=step?'bg-emerald-400':'bg-white/10'}"></div><div class="mt-1 text-[11px] font-bold ${i===step?'text-emerald-300':'text-slate-500'}">${s}</div></div>`).join('')}
function render(){
  const el=document.getElementById('app');
  let body='';
  if(step===0) body=`<div class="fade rounded-2xl border border-white/10 bg-white/[.04] p-5 md:p-8">
    <h1 class="text-2xl font-extrabold">${L.title} <span class="text-sm text-slate-400">${L.ref}</span></h1>
    <div class="fq mt-5 rounded-2xl bg-black/30 p-6 text-center text-4xl md:text-5xl leading-[2.2]">${L.words.map(function(w){return '<span class="inline-block mx-2 px-3 rounded-xl '+(w[1]==='noon'?'bg-emerald-500/15 text-emerald-300 outline outline-2 outline-emerald-400/60':w[1]==='trigger'?'bg-amber-500/15 text-amber-300 outline outline-2 outline-amber-400/60':'')+'">'+w[0]+'</span>'}).join('')}</div>
    <div class="mt-4 rounded-2xl border border-emerald-500/30 bg-emerald-500/5 p-4 text-sm leading-7"><b class="text-emerald-300">التعليل: </b>${L.exp}</div>
    <div class="mt-4 flex items-center gap-2 text-xs font-bold"><span class="text-slate-400">دروس أخرى:</span>'+[['izhar','الإظهار'],['ikhfa','الإخفاء'],['qalqalah','القلقلة']].map(function(x){return '<a href="demo-lesson.html?l='+x[0]+'" class="rounded-full bg-white/5 px-3 py-2">'+x[1]+'</a>'}).join('')+'</div>'+`
    <button onclick="step=1;render()" class="mt-5 w-full rounded-xl bg-emerald-500 py-3 text-sm font-extrabold hover:bg-emerald-400">التالي: مختبر الصوت ←</button></div>`;
  if(step===1) body=`<div class="fade rounded-2xl border border-white/10 bg-white/[.04] p-5 md:p-8">
    <h2 class="text-xl font-extrabold">🎙️ مختبر الصوت — اقرأ الآية وسنحلل نطقك</h2>
    <p class="text-xs text-slate-400 mt-1">اقرأ: <b class="fq text-base text-slate-200">${L.words.map(function(w){return w[0]}).join(' ')}</b> — سجّل 4 ثوانٍ على الأقل (ميكروفون وموجة حقيقية + تحليل تجريبي)</p>
    <canvas id="cv" width="600" height="110" class="mt-4 w-full rounded-xl bg-black/40"></canvas>
    <div class="mt-3 flex justify-between text-sm"><span class="font-bold">${sec} ث</span>
    ${rec==='rec'?'<span class="text-rose-300">🔴 جارٍ التسجيل…</span>':rec==='an'?'<span class="text-sky-300">⏳ نحلل الغنة والمد…</span>':''}</div>
    <div class="mt-3 flex gap-2">
    ${rec!=='rec'&&rec!=='an'?'<button onclick="startRec()" class="flex-1 rounded-xl bg-rose-500 py-3 text-sm font-extrabold">● بدء التسجيل</button>':''}
    ${rec==='rec'?'<button onclick="stopRec()" class="flex-1 rounded-xl bg-sky-500 py-3 text-sm font-extrabold">■ إيقاف وتحليل</button>':''}${micBlocked?'<button onclick="demoMic()" class="flex-1 rounded-xl bg-violet-500 py-3 text-sm font-extrabold">🎧 وضع تجريبي بدون ميكروفون</button>':''}</div>
function demoMic(){micBlocked=false;rec='an';render();setTimeout(()=>{voice=0.78;rec='done';render()},2000)}
    ${voice!==null?`<div class="mt-4 grid grid-cols-3 gap-2 text-center text-xs fade">${[['الوضوح',voice],['زمن الغنة',Math.min(1,voice+.05)],['المخرج',Math.max(0,voice-.07)]].map(x=>`<div class="rounded-xl bg-black/30 p-3"><div class="text-lg font-extrabold text-emerald-300">${Math.round(x[1]*100)}%</div><div class="text-slate-400">${x[0]}</div></div>`).join('')}</div>`:''}
    <div class="mt-4 flex gap-2"><button onclick="step=0;render()" class="rounded-xl bg-white/5 px-5 py-3 text-sm font-bold">→ السابق</button>
    <button ${voice===null?'disabled':''} onclick="step=2;render()" class="flex-1 rounded-xl py-3 text-sm font-extrabold ${voice===null?'bg-white/10 text-slate-500':'bg-emerald-500 hover:bg-emerald-400'}">${voice===null?'سجّل أولاً للمتابعة':'التالي: التثبيت السريع ←'}</button></div></div>`;
  if(step===2){const qs=answers.filter((a,i)=>a===QUIZ[i].c).length/QUIZ.length, fs=Math.round(((qs*.6)+(voice??qs)*.4)*100)/100;
    body=`<div class="fade rounded-2xl border border-white/10 bg-white/[.04] p-5 md:p-8"><h2 class="text-xl font-extrabold">اختبار سريع — ${QUIZ.length} أسئلة</h2>
    ${QUIZ.map((q,qi)=>`<div class="mt-4 rounded-xl bg-black/20 p-4"><p class="text-sm font-bold">${q.q}</p><div class="mt-2 space-y-2">${q.o.map((o,oi)=>`<button onclick="answers[${qi}]=${oi};render()" class="w-full rounded-xl border px-3 py-2.5 text-right text-sm ${answers[qi]===oi?'border-emerald-400 bg-emerald-500/15 text-emerald-200':'border-white/10 bg-white/5'}">${o}</button>`).join('')}</div></div>`).join('')}
    <div class="mt-4 flex gap-2"><button onclick="step=1;render()" class="rounded-xl bg-white/5 px-5 py-3 text-sm font-bold">→ السابق</button>
    <button ${answers.includes(-1)?'disabled':''} onclick="finish()" class="flex-1 rounded-xl py-3 text-sm font-extrabold ${answers.includes(-1)?'bg-white/10 text-slate-500':'bg-emerald-500 hover:bg-emerald-400'}">✓ إنهاء الدرس — الدرجة ${Math.round(fs*100)}%</button></div></div>`;}
  if(step===3) body=`<div class="fade rounded-2xl border border-white/10 bg-white/[.04] p-8 text-center">
    <div class="text-5xl">${done.completed?'🎉':'💪'}</div>
    <h2 class="mt-2 text-2xl font-extrabold">${done.completed?'أتقنت الحكم!':'تقدّم جيد — أعد المحاولة للإتقان'}</h2>
    <p class="text-sm text-slate-400 mt-1">العقدة n-izhar أصبحت ${done.completed?'مكتملة ✓':'قيد التقدم'} في الشجرة</p>
    <div class="mx-auto mt-4 grid max-w-md grid-cols-2 gap-2">
      <div class="rounded-xl bg-amber-400/10 border border-amber-400/30 p-4"><div class="text-2xl font-extrabold text-amber-300">+${done.xp} XP</div><div class="text-xs text-slate-400">نقاط جديدة</div></div>
      <div class="rounded-xl bg-orange-500/10 border border-orange-500/30 p-4"><div class="text-2xl font-extrabold text-orange-300">🔥 ${XP.streak()}</div><div class="text-xs text-slate-400">سلسلة الأيام</div></div></div>
    <p class="text-xs text-slate-400 mt-3">رصيدك الكلي على هذا الجهاز: ${XP.get()} XP • رتبتك: ${XP.rank()}</p>
    <button onclick="step=0;answers=[-1,-1];voice=null;done=null;rec='idle';sec=0;render()" class="mt-4 rounded-xl bg-emerald-500 px-8 py-3 text-sm font-extrabold">↻ إعادة الدرس</button></div>`;
  el.innerHTML=`<div class="mb-4 flex justify-between items-center"><span class="rounded-full bg-white/5 px-4 py-2 text-xs font-bold">→ شجرة الأحكام / الإظهار الحلقي</span><span class="rounded-full bg-amber-400/10 border border-amber-400/30 px-3 py-1 text-xs font-bold text-amber-300">⚡ +${L.xp} XP عند الإتقان</span></div>
  <div class="mb-6 flex gap-2">${bar()}</div>`+body;
  if(step===1&&rec==='rec') sizeCanvas();
}
async function startRec(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const AC=new (window.AudioContext||window.webkitAudioContext)(),src=AC.createMediaStreamSource(stream),an=AC.createAnalyser();an.fftSize=2048;src.connect(an);
  window._ac=AC;rec='rec';sec=0;render();
  timer=setInterval(()=>{sec++;const s=document.querySelector('#app span.font-bold');if(s)s.textContent=sec+' ث'},1000);
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),buf=new Uint8Array(an.fftSize);
  (function loop(){an.getByteTimeDomainData(buf);ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle='#34d399';ctx.lineWidth=2;ctx.beginPath();
  buf.forEach((v,i)=>{const x=i/buf.length*cv.width,y=(v-128)/128*(cv.height/2-4)+cv.height/2;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
  if(rec==='rec')requestAnimationFrame(loop)})();
}catch(e){micBlocked=true;render()}}
function sizeCanvas(){}
function stopRec(){clearInterval(timer);stream&&stream.getTracks().forEach(t=>t.stop());window._ac&&window._ac.close();rec='an';render();
  setTimeout(()=>{voice=Math.min(1,Math.round((.55+Math.min(1,sec/4)*.4+Math.random()*.08)*100)/100);rec='done';render()},1800)}
function finish(){const qs=answers.filter((a,i)=>a===QUIZ[i].c).length/QUIZ.length,fs=Math.round(((qs*.6)+(voice??qs)*.4)*100)/100,ok=fs>=.7;
  done={xp:ok?L.xp:Math.round(L.xp*.1*fs),completed:ok};try{XP.add(done.xp)}catch(e){}step=3;render()}
render();
</script>
</body>
</html>
